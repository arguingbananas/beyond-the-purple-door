name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so new advisories surface even without commits

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # the minimum supported Python, the one used locally, and the newest release
        python: ["3.11", "3.12", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dev tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          npm ci
      - name: Lint
        run: tools/lint.sh
      # The game image is not in the repo, so the tests that need it skip themselves here;
      # run tools/verify.sh locally for the hash checks.
      - name: Tests
        run: tools/test.sh

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dev tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          npm ci
      - name: Audit dev dependencies
        run: tools/audit.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so new advisories surface even without commits

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install dev tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          npm ci
      - name: Lint
        run: tools/lint.sh
      # The game image is not in the repo, so the tests that need it skip themselves here;
      # run tools/verify.sh locally for the hash checks.
      - name: Tests
        run: tools/test.sh

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install dev tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          npm ci
      - name: Audit dev dependencies
        run: tools/audit.sh
